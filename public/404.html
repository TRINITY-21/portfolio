<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Joseph Yaw Agyeman</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        color: #fafafa;
        font-family: 'Inter', -apple-system, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .container { max-width: 420px; }
      .code {
        font-size: 6rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        background: linear-gradient(to right, #fafafa, rgba(6,182,212,0.8), #06b6d4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
      }
      .message {
        color: #737373;
        font-size: 1rem;
        margin-top: 1rem;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.75rem 2rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #fafafa;
        background: rgba(6,182,212,0.1);
        border: 1px solid rgba(6,182,212,0.2);
        border-radius: 0.75rem;
        text-decoration: none;
        transition: all 0.3s;
      }
      .btn:hover {
        background: rgba(6,182,212,0.2);
        box-shadow: 0 0 24px rgba(6,182,212,0.12);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">404</div>
      <p class="message">This page doesn't exist. It may have been moved or the URL is incorrect.</p>
      <a href="/" class="btn">Back to Home</a>
    </div>
  </body>
</html>
